{{- if and (eq .Values.global.clusterPlatform "Azure") .Values.global.coco.pullSecretNamespaces }}
---
# Distribute the cluster pull secret to workload namespaces for Azure peer-pods.
# Peer-pods (kata-remote) CVMs do not fetch registry credentials via KBS
# authenticated_registry_credentials_uri. The pull secret must be on the
# default service account via imagePullSecrets.
#
# Add namespaces to the list above to distribute to additional workloads.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: ps-dist
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: ps-dist-cp
      spec:
        remediationAction: enforce
        severity: medium
        object-templates:
        {{- range $ns := .Values.global.coco.pullSecretNamespaces }}
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            metadata:
              name: pull-secret
              namespace: {{ $ns }}
            type: kubernetes.io/dockerconfigjson
            data:
              .dockerconfigjson: '{{ `{{ fromSecret "openshift-config" "pull-secret" ".dockerconfigjson" }}` }}'
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: default
              namespace: {{ $ns }}
            imagePullSecrets:
            - name: pull-secret
        {{- end }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: ps-dist-binding
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
placementRef:
  name: ps-dist-rule
  kind: PlacementRule
  apiGroup: apps.open-cluster-management.io
subjects:
  - name: ps-dist
    kind: Policy
    apiGroup: policy.open-cluster-management.io
---
apiVersion: apps.open-cluster-management.io/v1
kind: PlacementRule
metadata:
  name: ps-dist-rule
spec:
  clusterConditions:
    - status: 'True'
      type: ManagedClusterConditionAvailable
  clusterSelector:
    matchLabels:
      cloud: Azure
---
{{- end }}
